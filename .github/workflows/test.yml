name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t local-whisper-dictation:test .
      - run: docker compose --env-file .env.example config --quiet
      - run: docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges --mount type=bind,source=${{ github.workspace }}/tests,target=/tests,readonly local-whisper-dictation:test python -B -m unittest discover -s /tests -v
  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile dictation.py service.py
      - run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem -Filter '*.ps1').Name) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Build portable Windows companion
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\Build-Portable.ps1
      - name: Verify distribution and write checksum
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead("$PWD/SimpleWhisper-Windows-x64.zip")
          try {
            $names = @($archive.Entries.FullName | ForEach-Object { $_.Replace('\', '/') })
            foreach ($required in @('portable/SimpleWhisper/SimpleWhisper.exe', 'portable/SimpleWhisper/_internal/ui_assets/mic-off.png', 'ui_assets/toggle-on.png', 'docs/assets/hero.svg', 'docs/GETTING-STARTED.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'licenses/PYTHON-LICENSE.txt', '.env.example', 'models.lock.json', 'Start-Dictation.ps1', 'Start-DictationWorker.ps1')) {
              if ($required -notin $names) { throw "Missing package file: $required" }
            }
            if ($names | Where-Object { $_ -match '(^|/)(\.env|settings\.json)$|\.(gguf|bin|wav|mp3|sqlite|db)$' }) { throw 'Unexpected private or model/audio payload' }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash SimpleWhisper-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SimpleWhisper-Windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SimpleWhisper-Windows-x64
          path: |
            SimpleWhisper-Windows-x64.zip
            SHA256SUMS.txt
          retention-days: 14
