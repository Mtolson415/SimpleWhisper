name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t local-whisper-dictation:test .
      - run: docker compose --env-file .env.example config --quiet
      - run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --mount type=bind,source=${{ github.workspace }}/tests,target=/tests,readonly local-whisper-dictation:test python -B -m unittest discover -s /tests -v
  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile dictation.py service.py
      - run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem -Filter '*.ps1').Name) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Build portable Windows companion
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\Build-Portable.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LocalWhisperDictation-Windows-x64
          path: LocalWhisperDictation-Windows-x64.zip
          retention-days: 14
