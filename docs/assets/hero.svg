<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">SimpleWhisper — your voice, your computer</title><desc id="desc">Illustrated floating microphone toolbar beside a synthetic writing field. Local dictation for Windows.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101928"/><stop offset="1" stop-color="#172b3b"/></linearGradient></defs>
<rect width="1200" height="440" rx="24" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="56" y="70" fill="#7dd3fc" font-size="16" letter-spacing="3">LOCAL DICTATION · WINDOWS 11</text><text x="56" y="146" fill="#f8fafc" font-size="58" font-weight="700">SimpleWhisper</text><text x="56" y="200" fill="#cbd5e1" font-size="27">Your voice. Your computer.</text><text x="56" y="249" fill="#94a3b8" font-size="20">A floating switch for everyday writing.</text>
<rect x="56" y="300" width="175" height="42" rx="21" fill="#153e38"/><text x="79" y="328" fill="#86efac" font-size="17">Local inference</text><rect x="247" y="300" width="160" height="42" rx="21" fill="#20364f"/><text x="271" y="328" fill="#bae6fd" font-size="17">MIT licensed</text>
<rect x="658" y="148" width="480" height="220" rx="18" fill="#0b1220" stroke="#334155"/><text x="690" y="184" fill="#94a3b8" font-size="16">Example writing field</text><text x="690" y="250" fill="#e2e8f0" font-size="23">Turn a thought into text.</text><text x="690" y="293" fill="#e2e8f0" font-size="23">Speak. Pause. Keep writing.</text><path d="M1024 273v26" stroke="#7dd3fc" stroke-width="2"/>
<rect x="760" y="58" width="320" height="72" rx="15" fill="#202125" stroke="#64748b"/><circle cx="800" cy="94" r="23" fill="#166534"/><rect x="794" y="80" width="12" height="22" rx="6" fill="#dcfce7"/><path d="M789 93v3a11 11 0 0 0 22 0v-3m-11 14v6m-6 0h12" fill="none" stroke="#dcfce7" stroke-width="2"/><text x="841" y="101" fill="#e2e8f0" font-size="18">On top</text><rect x="919" y="83" width="40" height="22" rx="11" fill="#38bdf8"/><circle cx="948" cy="94" r="8" fill="#fff"/><text x="1000" y="103" fill="#cbd5e1" font-size="24">⚙</text><text x="658" y="400" fill="#94a3b8" font-size="15">Interface illustration · synthetic example text</text><text x="56" y="400" fill="#94a3b8" font-size="16">Click the microphone or press Ctrl+Alt+D.</text></g></svg>
